name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: facturia
          POSTGRES_PASSWORD: facturia_ci
          POSTGRES_DB: facturia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U facturia -d facturia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://facturia:facturia_ci@127.0.0.1:5432/facturia?schema=public
      AUTH_SECRET: ci-auth-secret-at-least-32-characters
      AUTH_URL: http://localhost:9070
      APP_URL: http://localhost:9070
      MAIL_TRANSPORT: local
      LOCAL_MAIL_DIR: ${{ github.workspace }}/.local/mail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: mkdir -p .local/mail
      - run: npm run test:auth
      - run: npm run build --workspace @mombongo/web -- --webpack
